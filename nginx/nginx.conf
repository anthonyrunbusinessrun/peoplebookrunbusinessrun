# ============================================================
# nginx.conf — Birdy / PeopleBook Railway reverse proxy
# ============================================================
# Sits in front of the Next.js app service.
# Provides: rate limiting, connection limiting, gzip, SSE passthrough,
#           security headers, static asset caching, bot blocking.
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $request_method "$request_uri" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout main buffer=16k flush=5s;

  # Performance
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  reset_timedout_connection on;
  client_body_timeout  12;
  client_header_timeout 12;
  send_timeout          10;

  # Buffer tuning — prevent memory spikes on Railway
  client_body_buffer_size  128k;
  client_max_body_size     20m;          # allow file uploads
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  proxy_buffer_size        4k;
  proxy_buffers            8 32k;
  proxy_busy_buffers_size  64k;

  # Gzip — compresses JSON/HTML/JS responses significantly
  gzip              on;
  gzip_comp_level   4;
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_types
    application/javascript
    application/json
    application/x-javascript
    text/css
    text/html
    text/javascript
    text/plain
    text/xml;

  # ── Rate limiting zones ─────────────────────────────────────────────────
  # General zone: 30 req/s per IP across all routes
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

  # Birdy chat zone: 3 req/s per IP (prevents hammering the AI endpoint)
  limit_req_zone $binary_remote_addr zone=birdy_chat:10m rate=3r/s;

  # Apply form: 1 req/s per IP (prevent spam applications)
  limit_req_zone $binary_remote_addr zone=apply:10m rate=1r/s;

  # Connection limit: max 20 concurrent connections per IP
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Block known scanner user-agents ────────────────────────────────────
  map $http_user_agent $bad_bot {
    default           0;
    ~*sqlmap          1;
    ~*nikto           1;
    ~*masscan         1;
    ~*nmap            1;
    ~*zgrab           1;
    ~*go-http-client  1;
    ~*python-requests 1;
  }

  # ── Upstream: Next.js app on Railway internal network ──────────────────
  # Railway assigns $PORT env var; Next.js listens on 3000 by default.
  # Use NEXTJS_INTERNAL_URL env var set in Railway nginx service settings.
  upstream nextjs {
    server ${NEXTJS_UPSTREAM};    # e.g. "web.railway.internal:3000"
    keepalive 32;                  # keep connections warm
  }

  # ── HTTPS redirect (Railway terminates TLS, so we just see HTTP here) ──
  server {
    listen 8080;
    server_name _;

    # Drop bad bots immediately
    if ($bad_bot) { return 403; }

    # Block common scanner paths without logging
    location ~* ^/(wp-admin|wp-login|\.env|phpMyAdmin|xmlrpc\.php|\.git) {
      return 404;
    }

    # Apply connection limit globally
    limit_conn conn_limit 20;

    # ── Static assets — serve with long cache ──────────────────────────
    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache-Status "STATIC";
      access_log off;
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    # ── Birdy SSE streaming endpoint — special config ───────────────────
    location /api/birdy/chat {
      limit_req zone=birdy_chat burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Critical for SSE: disable all buffering so tokens stream immediately
      proxy_buffering          off;
      proxy_cache              off;
      proxy_read_timeout       65s;   # match maxDuration=55 in route.ts + buffer
      proxy_send_timeout       65s;
      proxy_connect_timeout    5s;
      chunked_transfer_encoding on;

      # SSE headers
      add_header Cache-Control        "no-store, no-cache, must-revalidate";
      add_header X-Accel-Buffering    "no";
      add_header X-Content-Type-Options "nosniff";
    }

    # ── Application form — strict rate limit ───────────────────────────
    location /api/apply {
      limit_req zone=apply burst=3 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── All other routes ───────────────────────────────────────────────
    location / {
      limit_req zone=general burst=60 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;

      # Security headers
      add_header X-Content-Type-Options  "nosniff" always;
      add_header X-Frame-Options         "SAMEORIGIN" always;
      add_header X-XSS-Protection        "1; mode=block" always;
      add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    }

    # ── Rate limit error page ──────────────────────────────────────────
    error_page 429 @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"error":"Too many requests. Please slow down.","retryAfter":10}';
    }

    # ── Health check (used by Railway) ─────────────────────────────────
    location /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
